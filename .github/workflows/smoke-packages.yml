name: Start test of every package
# Builds each package's main branch and runs the start test on it, to check
# the test itself (a package that fails here would block its automatic
# updates). Manual only.
on:
  workflow_dispatch:
  push:
    branches: [dispatch-and-smoke]
    paths: ['smoke/**', '.github/workflows/smoke-packages.yml']
permissions: { contents: read }
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        repo: [AVADO-DNP-Aztec, AVADO-DNP-BitcoinCore, AVADO-DNP-Fulcrum, AVADO-DNP-HomeAssistant, AVADO-DNP-Immich,
               AVADO-DNP-Jellyfin, AVADO-DNP-Lightning, AVADO-DNP-Mempool, AVADO-DNP-Paperless-ngx, AVADO-DNP-Private-Assistant,
               AVADO-DNP-Starknet, AVADO-DNP-Tailscale, AVADO-DNP-Vaultwarden, AVADO-DNP-Teku, AVADO-DNP-Nimbus,
               AVADO-DNP-NearBP, AVADO-DNP-Prysm-beacon-chain, AVADO-DNP-Prysm-validator, AVADO-DNP-Nethermind,
               AVADO-DNP-AvalancheGo, dappnode-geth]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: action }
      - uses: actions/checkout@v4
        with: { repository: 'AvadoDServer/${{ matrix.repo }}', path: pkg }
      - name: Build
        working-directory: pkg
        run: docker compose build
      - name: Start test
        working-directory: pkg
        run: bash ../action/smoke/smoke.sh
        env: { SMOKE_SECONDS: '90' }
  # The test must fail on a package that crashes: a crash loop, an error exit,
  # and a client that crashes under supervisord.
  catches-crashes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        case: [loop, exit, supervisord]
    steps:
      - uses: actions/checkout@v4
      - name: Package that crashes
        run: |
          mkdir pkg && cd pkg
          case "${{ matrix.case }}" in
            loop) cmd='["sh","-c","sleep 2; exit 3"]'; restart=always ;;
            exit) cmd='["sh","-c","exit 2"]'; restart=no ;;
            supervisord)
              printf '[supervisord]\nnodaemon=true\nuser=root\n[unix_http_server]\nfile=/tmp/s.sock\n[supervisorctl]\nserverurl=unix:///tmp/s.sock\n[rpcinterface:supervisor]\nsupervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface\n[program:client]\ncommand=sh -c "sleep 1; exit 1"\nstartretries=2\n' > s.conf
              printf 'FROM python:3.12-alpine\nRUN pip install -q supervisor\nCOPY s.conf /s.conf\nCMD ["supervisord","-c","/s.conf"]\n' > Dockerfile
              cmd='["supervisord","-c","/s.conf"]'; restart=always ;;
          esac
          [ -f Dockerfile ] || printf 'FROM busybox\n' > Dockerfile
          printf "services:\n  crash:\n    image: crash:test\n    build: .\n    command: %s\n    restart: %s\n" "$cmd" "$restart" > docker-compose.yml
          docker compose build -q
      - name: Start test must fail
        working-directory: pkg
        env: { SMOKE_SECONDS: '30' }
        run: |
          if bash ../smoke/smoke.sh; then echo "::error::start test passed a crashing package"; exit 1; fi
          echo "start test failed as it should"
